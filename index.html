<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>H2tM Member</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="page">
  <div class="card">

    <div class="brand">
      <img class="brand-logo" src="assets/logo.png" alt="Harvest to the Moon" />
      <h1>H2tM Member</h1>
      <p class="subtitle">Join our membership program</p>
    </div>

    <div id="liffLoading" class="loading">
      <div class="spinner"></div>
      <span>Connecting to LINE...</span>
    </div>

    <div id="profileBox" class="profile-box hidden">
      <img id="profilePic" src="" alt="profile" />
      <div>
        <div class="profile-name" id="profileName"></div>
        <div class="profile-tag">LINE Connected</div>
      </div>
    </div>

    <form id="registerForm" class="hidden">
      <div class="field">
        <label for="fullname">Full Name</label>
        <input type="text" id="fullname" name="fullname" placeholder="John Doe" required autocomplete="name" />
      </div>

      <div class="field">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" placeholder="08X-XXX-XXXX" required autocomplete="tel" />
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email" />
      </div>

      <button type="submit" id="submitBtn" class="btn">Register</button>
    </form>

    <div id="dashboardBox" class="dashboard hidden">
      <div class="dashboard-title">Member Details</div>

      <div class="detail-row">
        <span class="detail-label">Full Name</span>
        <span class="detail-value" id="dbFullname"></span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Phone Number</span>
        <span class="detail-value" id="dbPhone"></span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Email</span>
        <span class="detail-value" id="dbEmail"></span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Member Since</span>
        <span class="detail-value" id="dbSince"></span>
      </div>
    </div>

    <div id="resultMsg" class="result-msg hidden"></div>
    <button type="button" id="viewDashboardBtn" class="btn hidden">View My Dashboard</button>

  </div>
</div>

<!-- LINE LIFF SDK -->
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
